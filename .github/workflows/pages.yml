# Veroeffentlicht die statische Seite auf GitHub Pages bei jedem Push auf main.
name: Seite auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Seite als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
